services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ft
      POSTGRES_USER: ft
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ft"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://ft:${DB_PASSWORD}@db:5432/ft
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:3000"
    restart: unless-stopped

volumes:
  postgres_data:
